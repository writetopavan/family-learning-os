steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/family-learning-os:$COMMIT_SHA
      - ./apps/api

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/family-learning-os:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - family-learning-os
      - --image
      - gcr.io/$PROJECT_ID/family-learning-os:$COMMIT_SHA
      - --region
      - asia-south1
      - --platform
      - managed
      - --allow-unauthenticated
      - --quiet

images:
  - gcr.io/$PROJECT_ID/family-learning-os:$COMMIT_SHA
