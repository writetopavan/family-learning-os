name: Learning workspace checks

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web-auth.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web-auth.yml'

permissions:
  contents: read

jobs:
  auth-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "../api[dev]"
      - run: python -m pytest ../api/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
