[project]
name = "family-learning-os-api"
version = "0.1.0"
description = "FastAPI backend for Family Learning OS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "supabase>=2.15,<3",
  "httpx>=0.28,<1",
  "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1"
]

[tool.ruff]
line-length = 100
target-version = "py312"
